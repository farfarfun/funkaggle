[project]
name = "funkaggle"
version = "0.0.3"
description = "Kaggle DFDC（Deepfake Detection Challenge）2019-2020 参赛脚本存档：下载 / 抽帧 / 训练 / 预测"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "farlog>=1.1.7",
    "funfile>=1.0.39",
    "funget>=1.1.63",
    "kaggle>=1.6",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "tensorflow>=2.16",
    "face-recognition>=1.3.0",
    "tqdm>=4.65",
    "demjson3>=3.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funkaggle"]

[dependency-groups]
dev = ["pytest>=8.0"]
