[project]
name = "notekaggle"
version = "0.0.1"
description = "notekaggle"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
